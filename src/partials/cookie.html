<!-- ══ Cookie banner ══ -->
<div class="cookie" id="cookie">
  <div class="cookie__inner">
    <div class="cookie__text">
      <h4>Confidențialitatea ta contează</h4>
      <p>Folosim cookie-uri pentru a personaliza conținutul și a analiza traficul. Poți alege ce accepți.</p>
    </div>
    <div class="cookie__btns">
      <button class="btn btn--tiny btn--outline-dark" type="button" data-cookie="custom">Personalizează</button>
      <button class="btn btn--tiny btn--blue" type="button" data-cookie="reject">Respinge</button>
      <button class="btn btn--tiny btn--blue" type="button" data-cookie="accept">Acceptă</button>
    </div>
  </div>
</div>
